<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Development Server Stack Dashboard | 192.168.0.5</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React & Babel CDNs for instant modern React SPA execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .badge-ip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-blue);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            margin-top: 0.8rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
        }

        .status-online {
            background-color: var(--accent-green);
            color: var(--accent-green);
        }

        .status-offline {
            background-color: var(--accent-red);
            color: var(--accent-red);
        }

        .card-body {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .card-info {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-main);
            word-break: break-all;
            margin-top: 0.8rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .interactive-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--card-border);
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [health, setHealth] = useState(null);
            const [loading, setLoading] = useState(true);
            const [taskName, setTaskName] = useState('Data Pipeline Job');
            const [activeTask, setActiveTask] = useState(null);
            const [taskStatus, setTaskStatus] = useState(null);
            const [triggering, setTriggering] = useState(false);

            const fetchHealth = async () => {
                try {
                    const res = await fetch('/api/health');
                    const data = await res.json();
                    setHealth(data);
                } catch (err) {
                    setHealth({ status: 'offline', error: err.message });
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchHealth();
                const interval = setInterval(fetchHealth, 5000);
                return () => clearInterval(interval);
            }, []);

            const handleDispatchTask = async (e) => {
                e.preventDefault();
                setTriggering(true);
                setTaskStatus(null);
                try {
                    const res = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_name: taskName, duration_seconds: 4 })
                    });
                    const data = await res.json();
                    setActiveTask(data.task_id);
                    pollTaskStatus(data.task_id);
                } catch (err) {
                    alert('Failed to dispatch task: ' + err.message);
                } finally {
                    setTriggering(false);
                }
            };

            const pollTaskStatus = (taskId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/tasks/${taskId}`);
                        const data = await res.json();
                        setTaskStatus(data);
                        if (data.status === 'SUCCESS' || data.status === 'FAILURE') {
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        clearInterval(pollInterval);
                    }
                }, 1000);
            };

            const isHttps = window.location.protocol === 'https:';

            return (
                <div>
                    <header className="header">
                        <h1><i className="fa-solid fa-server"></i> Server Stack Control Center</h1>
                        <p>Real-time Status Monitor & Celery Worker Automation</p>
                        <div className="badge-ip">
                            <i className="fa-solid fa-network-wired"></i> Server: 192.168.0.5
                        </div>
                    </header>

                    <main className="container">
                        <h2 className="section-title">
                            <i className="fa-solid fa-cubes"></i> Core Services Status
                        </h2>

                        <div className="grid">
                            {/* Docker & Nginx Reverse Proxy */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon" style={{color: '#38bdf8'}}>
                                            <i className="fa-brands fa-docker"></i>
                                        </div>
                                        <span>Docker & Nginx</span>
                                    </div>
                                    <span className="status-dot status-online"></span>
                                </div>
                                <div className="card-body">
                                    Nginx Reverse Proxy routing HTTP/HTTPS traffic to FastAPI backend & React frontend.
                                    <div className="card-info">
                                        Container: app_nginx<br/>
                                        Ports: 80 (HTTP) -> 443 (HTTPS)
                                    </div>
                                </div>
                            </div>

                            {/* HTTPS SSL Certificate */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon" style={{color: '#4ade80'}}>
                                            <i className="fa-solid fa-shield-halved"></i>
                                        </div>
                                        <span>HTTPS / TLS</span>
                                    </div>
                                    <span className={`status-dot ${isHttps ? 'status-online' : 'status-offline'}`}></span>
                                </div>
                                <div className="card-body">
                                    OpenSSL SAN Security Certificate active for IP 192.168.0.5.
                                    <div className="card-info">
                                        Protocol: {window.location.protocol.toUpperCase()}<br/>
                                        Encryption: Active (SAN 192.168.0.5)
                                    </div>
                                </div>
                            </div>

                            {/* PostgreSQL Database */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon" style={{color: '#818cf8'}}>
                                            <i className="fa-solid fa-database"></i>
                                        </div>
                                        <span>PostgreSQL 16</span>
                                    </div>
                                    <span className={`status-dot ${health?.postgresql?.connected ? 'status-online' : 'status-offline'}`}></span>
                                </div>
                                <div className="card-body">
                                    Relational Database Container with persistent volume.
                                    <div className="card-info">
                                        Status: {health?.postgresql?.connected ? 'Connected' : 'Connecting...'}<br/>
                                        Details: {health?.postgresql?.info?.substring(0, 35) || 'N/A'}...
                                    </div>
                                </div>
                            </div>

                            {/* Redis Cache & Broker */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon" style={{color: '#f87171'}}>
                                            <i className="fa-solid fa-bolt"></i>
                                        </div>
                                        <span>Redis 7</span>
                                    </div>
                                    <span className={`status-dot ${health?.redis?.connected ? 'status-online' : 'status-offline'}`}></span>
                                </div>
                                <div className="card-body">
                                    In-memory Key-Value store serving as Celery task message broker.
                                    <div className="card-info">
                                        Status: {health?.redis?.connected ? 'Connected' : 'Connecting...'}<br/>
                                        Ping Response: {health?.redis?.response || 'N/A'}
                                    </div>
                                </div>
                            </div>

                            {/* FastAPI Backend */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon" style={{color: '#c084fc'}}>
                                            <i className="fa-solid fa-bolt-lightning"></i>
                                        </div>
                                        <span>FastAPI Backend</span>
                                    </div>
                                    <span className={`status-dot ${health?.status === 'healthy' ? 'status-online' : 'status-offline'}`}></span>
                                </div>
                                <div className="card-body">
                                    High-performance Python API framework running Uvicorn server.
                                    <div className="card-info">
                                        Overall Status: {health?.status?.toUpperCase() || 'OFFLINE'}<br/>
                                        Last Checked: {health?.timestamp || 'N/A'}
                                    </div>
                                </div>
                            </div>

                            {/* Celery Worker */}
                            <div className="card">
                                <div className="card-header">
                                    <div className="card-title">
                                        <div className="card-icon" style={{color: '#facc15'}}>
                                            <i className="fa-solid fa-gears"></i>
                                        </div>
                                        <span>Celery Worker</span>
                                    </div>
                                    <span className="status-dot status-online"></span>
                                </div>
                                <div className="card-body">
                                    Asynchronous Background Job Processor executing task queue.
                                    <div className="card-info">
                                        Container: app_celery_worker<br/>
                                        Broker: Redis 7
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Interactive Celery Task Dispatcher */}
                        <div className="interactive-panel">
                            <h3 style={{fontSize: '1.4rem', marginBottom: '1rem'}}>
                                <i className="fa-solid fa-play"></i> Test Celery Background Worker
                            </h3>
                            <p style={{color: 'var(--text-sub)', marginBottom: '1.5rem'}}>
                                Dispatch an asynchronous task to Redis broker and watch the Celery worker process it in real time:
                            </p>
                            
                            <form onSubmit={handleDispatchTask} style={{display: 'flex', gap: '1rem', flexWrap: 'wrap'}}>
                                <input 
                                    type="text" 
                                    value={taskName}
                                    onChange={(e) => setTaskName(e.target.value)}
                                    placeholder="Task Name"
                                    style={{
                                        background: 'rgba(0,0,0,0.3)',
                                        border: '1px solid var(--card-border)',
                                        color: 'white',
                                        padding: '0.8rem 1rem',
                                        borderRadius: '10px',
                                        flex: 1,
                                        minWidth: '250px',
                                        fontSize: '1rem'
                                    }}
                                />
                                <button type="submit" className="btn" disabled={triggering}>
                                    <i className="fa-solid fa-paper-plane"></i>
                                    {triggering ? 'Dispatching...' : 'Dispatch Celery Job'}
                                </button>
                            </form>

                            {activeTask && (
                                <div className="card-info" style={{marginTop: '1.5rem', padding: '1rem'}}>
                                    <div><strong>Task ID:</strong> {activeTask}</div>
                                    <div><strong>Worker Status:</strong> <span style={{color: taskStatus?.status === 'SUCCESS' ? 'var(--accent-green)' : 'var(--accent-yellow)'}}>{taskStatus?.status || 'PENDING'}</span></div>
                                    {taskStatus?.result && (
                                        <div style={{marginTop: '0.5rem', borderTop: '1px dashed rgba(255,255,255,0.2)', paddingTop: '0.5rem'}}>
                                            <strong>Worker Output:</strong>
                                            <pre style={{whiteSpace: 'pre-wrap', marginTop: '0.25rem', color: 'var(--accent-blue)'}}>
                                                {JSON.stringify(taskStatus.result, null, 2)}
                                            </pre>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="footer">
                        Development Server 192.168.0.5 &bull; Docker + PostgreSQL + Redis + FastAPI + Celery + React + Nginx + HTTPS
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
