name: CI/CD Quality & Security Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Lint & Syntax Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Python Code Formatting (Black)
        run: |
          black --check backend/app backend/tests || echo "Black formatting warnings"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

  backend-tests-and-security:
    name: Backend Pytest, Security & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      - name: Run Bandit Security Audit
        working-directory: ./backend
        run: |
          bandit -r app -ll -ii || echo "Bandit security audit complete"

      - name: Run Backend Pytest Suite with Coverage
        working-directory: ./backend
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: scheduler
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: ci_cd_secret_key_for_testing_purposes_only_32bytes
        run: |
          pytest --cov=app --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/

  frontend-tests-and-build:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build-validation:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Container Images
        run: |
          docker compose build
